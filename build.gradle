plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}
version = mod_version
group = 'traben'
base { archivesName = "flowing_fluids_neoforge_${minecraft_version}" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
sourceSets {
    main {
        java.srcDirs = ['common/src/main/java', 'neoforge/src/main/java']
        resources.srcDirs = ['common/src/main/resources', 'neoforge/src/main/resources']
        resources.exclude '**/*.accesswidener', 'architectury.common.json'
    }
    test { java.srcDirs = ['common/src/test/java', 'neoforge/src/test/java'] }
}
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
}
neoForge {
    version = neo_version
    accessTransformers.from('neoforge/src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer' }
        configureEach { systemProperty 'neoforge.enabledGameTestNamespaces', 'flowing_fluids' }
    }
    mods { flowing_fluids { sourceSet sourceSets.main } }
    unitTest {
        enable()
        testedMod = mods.flowing_fluids
    }
}
dependencies {
    compileOnly 'maven.modrinth:create:UjX6dr61'
    compileOnly 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly 'net.createmod.ponder:ponder-neoforge:1.0.85+mc1.21.1'
    compileOnly 'maven.modrinth:sodium:Pb3OXVqC'
    compileOnly 'maven.modrinth:itemphysic:rYw9JKpB'
    compileOnly 'maven.modrinth:creativecore:vn4lrETC'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation "net.neoforged:testframework:${neo_version}"
    if (providers.gradleProperty('compatTest').isPresent()) {
        testRuntimeOnly 'maven.modrinth:create:UjX6dr61'
        testRuntimeOnly 'maven.modrinth:itemphysic:rYw9JKpB'
        testRuntimeOnly 'maven.modrinth:creativecore:vn4lrETC'
        testRuntimeOnly 'maven.modrinth:mekanism:5KzzycBT'
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '300']
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'flowingFluids.projectDir', project.projectDir.absolutePath
}
processResources {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') { expand mod_version: mod_version }
}
jar { from('LICENSE') }
publishing { publications { mavenJava(MavenPublication) { from components.java } } }
