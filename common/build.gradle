import org.gradle.jvm.tasks.Jar

architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // Common sources still reference Fabric-provided mixin/env annotation types,
    // but Forge-only builds should not treat Fabric Loader as a runtime dependency.
    modCompileOnly "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.2")
    testImplementation("org.mockito:mockito-junit-jupiter:5.11.0")

}
loom {
    accessWidenerPath = file("src/main/resources/flowing_fluids_${project.mc_build}.accesswidener")
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(Jar).configureEach {
    exclude("net/fabricmc/api/**")
}
