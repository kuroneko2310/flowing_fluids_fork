import org.gradle.jvm.tasks.Jar

architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // Compile-only: Architectury/Loom common mixins need Fabric Loader's bundled
    // Mixin and environment annotation classes. This is not a runtime loader target.
    modCompileOnly "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.2")
    testImplementation("org.mockito:mockito-junit-jupiter:5.11.0")

}
loom {
    accessWidenerPath = file("src/main/resources/flowing_fluids_${project.mc_build}.accesswidener")
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
