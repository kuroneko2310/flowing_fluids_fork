modLoader = "javafml"
loaderVersion = "[1,)"
#issueTrackerURL = ""
license = "GNU LGPL 3.0"

[[mods]]
modId = "flowing_fluids"
version = "${version}"
displayName = "FlowingFluids"
authors = "Traben; maintained fork by kuroneko2310"
description = '''
Modified fork / continuation of Flowing Fluids by Traben, maintained by kuroneko2310.
Keeps finite-fluid physics while adding Forge-focused water pressure, hydraulic, spring, flood, and performance tuning work.
'''
logoFile = "assets/flowing_fluids/icon.png"

[[dependencies.flowing_fluids]]
modId = "neoforge"
type = "required"
versionRange = "[21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.flowing_fluids]]
modId = "minecraft"
type = "required"
versionRange = "[${compatible_mc_forge})"
ordering = "NONE"
side = "BOTH"

[[dependencies.flowing_fluids]]
modId = "create"
type = "incompatible"
# less than 0.6
versionRange = "(,0.6)"
ordering = "NONE"
side = "BOTH"


[[mixins]]
config = "flowing_fluids.mixins.json"

[[mixins]]
config = "flowing_fluids_neoforge.mixins.json"

#https://github.com/CaffeineMC/lithium/wiki/Disabling-Lithium's-Mixins-using-your-mod's-fabric.mod.json-or-neoforge.mods.toml
["lithium:options"]
"mixin.world.chunk_ticking.spread_ice" = false
